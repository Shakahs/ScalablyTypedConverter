name: CI Build
on: [push, pull_request]

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache build
        uses: coursier/cache-action@v8

      - name: Install coursier
        uses: coursier/setup-action@v3
        with:
          jvm: adoptium:1.21.0.1
          apps: sbt
      - uses: sbt/setup-sbt@v1

      - name: Clean
        run: sbt $SBT_JAVA_OPTS -v clean

      - name: Compile
        run: sbt $SBT_JAVA_OPTS -v compile

      - name: Test
        run: sbt $SBT_JAVA_OPTS -v test

      - name: Scalafmt check sbt
        if: matrix.os == 'ubuntu-latest'
        run: sbt $SBT_JAVA_OPTS -v scalafmtSbtCheck

      - name: Scalafmt check sources
        if: matrix.os == 'ubuntu-latest'
        run: sbt $SBT_JAVA_OPTS -v scalafmtCheckAll
